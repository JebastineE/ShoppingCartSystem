services:

  postgres:
    image: postgres:18
    container_name: shopping-postgres-compose
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopping_cart_db
    ports:
      - "5434:5432"
    volumes:
      - shopping_postgres_data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build:
      context: ./backend
    container_name: shopping-backend
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/shopping_cart_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      PORT: 8083
    ports:
      - "8083:8083"

  frontend:
    build:
      context: ./frontend
    container_name: shopping-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  shopping_postgres_data:
